[project]
name = "voice-to-document"
version = "0.1.0"
description = "Local-first voice recording documentation pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlite-vec==0.1.9",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
speech = [
  "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "whisperx==3.8.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/app", "backend/tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
