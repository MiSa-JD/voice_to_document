x-backend-environment: &backend-environment
  RECORDING_INPUT_DIR: ${RECORDING_INPUT_DIR:-/data/inbox}
  TRANSCRIPT_ROOT: ${TRANSCRIPT_ROOT:-/data/transcripts}
  SPEAKER_ROOT: ${SPEAKER_ROOT:-/data/speakers}
  DOCUMENT_ROOT: ${DOCUMENT_ROOT:-${SUMMARY_ROOT:-/data/documents}}
  APP_DATA_DIR: ${APP_DATA_DIR:-/data/app}
  SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-10}
  FILE_STABLE_SECONDS: ${FILE_STABLE_SECONDS:-30}
  CATEGORIES: ${CATEGORIES:-강의,일상 대화,회의,게임 목록,기타}
  AUTO_SUMMARY_CATEGORIES: ${AUTO_SUMMARY_CATEGORIES:-강의,회의}
  CLASSIFICATION_CONTEXT_MAX_CHARS: ${CLASSIFICATION_CONTEXT_MAX_CHARS:-120000}
  SPEECH_MODE: ${SPEECH_MODE:-${AI_MODE:-fake}}
  DOCUMENT_MODE: ${DOCUMENT_MODE:-${AI_MODE:-fake}}
  WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
  WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
  WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-4}
  SPEAKER_EMBEDDING_MODEL: ${SPEAKER_EMBEDDING_MODEL:-pyannote/embedding}
  SPEAKER_EMBEDDING_MODEL_REVISION: ${SPEAKER_EMBEDDING_MODEL_REVISION:-main}
  SPEAKER_EMBEDDING_DEVICE: ${SPEAKER_EMBEDDING_DEVICE:-cuda}
  SPEAKER_AUTO_MATCH_ENABLED: ${SPEAKER_AUTO_MATCH_ENABLED:-false}
  SPEAKER_AUTO_MATCH_THRESHOLD: ${SPEAKER_AUTO_MATCH_THRESHOLD:-}
  SPEAKER_MATCH_MARGIN: ${SPEAKER_MATCH_MARGIN:-}
  MODEL_CACHE_ROOT: /models
  HF_TOKEN: ${HF_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-volumes: &backend-read-volumes
  - ${RECORDING_INPUT_HOST_DIR:-${DATA_ROOT:-./runtime}/inbox}:${RECORDING_INPUT_DIR:-/data/inbox}:ro
  - ${TRANSCRIPT_HOST_DIR:-${DATA_ROOT:-./runtime}/transcripts}:${TRANSCRIPT_ROOT:-/data/transcripts}:ro
  - ${DATA_ROOT:-./runtime}/speakers:${SPEAKER_ROOT:-/data/speakers}:ro
  - ${DOCUMENT_HOST_DIR:-${DATA_ROOT:-./runtime}/documents}:${DOCUMENT_ROOT:-${SUMMARY_ROOT:-/data/documents}}:ro
  - ${DATA_ROOT:-./runtime}/app:${APP_DATA_DIR:-/data/app}

services:
  classification-eval:
    profiles: ["classification-eval"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "app.classification_eval"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: test
      DOCUMENT_MODE: real
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: gpt-5.4-nano-2026-03-17
    user: "${APP_RUN_UID:-1000}:${APP_RUN_GID:-1000}"
    volumes: *backend-read-volumes

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["uvicorn", "app.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: api
    user: "${APP_RUN_UID:-1000}:${APP_RUN_GID:-1000}"
    volumes: *backend-read-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: worker
      LLM_API_KEY: ${LLM_API_KEY:-}
    user: "${APP_RUN_UID:-1000}:${APP_RUN_GID:-1000}"
    volumes:
      - ${RECORDING_INPUT_HOST_DIR:-${DATA_ROOT:-./runtime}/inbox}:${RECORDING_INPUT_DIR:-/data/inbox}:ro
      - ${TRANSCRIPT_HOST_DIR:-${DATA_ROOT:-./runtime}/transcripts}:${TRANSCRIPT_ROOT:-/data/transcripts}
      - ${DATA_ROOT:-./runtime}/speakers:${SPEAKER_ROOT:-/data/speakers}
      - ${DOCUMENT_HOST_DIR:-${DATA_ROOT:-./runtime}/documents}:${DOCUMENT_ROOT:-${SUMMARY_ROOT:-/data/documents}}
      - ${DATA_ROOT:-./runtime}/app:${APP_DATA_DIR:-/data/app}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - ${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-38000}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped
