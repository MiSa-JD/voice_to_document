services:
  model-smoke:
    profiles: ["model"]
    build:
      context: .
      dockerfile: Dockerfile
      target: model-runtime
    command: ["python", "-m", "app.model_runtime"]
    environment:
      MODEL_CACHE_ROOT: /models
      XDG_CACHE_HOME: /models/xdg
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    user: "${MODEL_RUN_UID:-1000}:${MODEL_RUN_GID:-1000}"
    volumes:
      - ${MODEL_CACHE_ROOT:-./runtime/model-cache}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  transcription-smoke:
    profiles: ["transcription"]
    build:
      context: .
      dockerfile: Dockerfile
      target: model-runtime
    command: ["python", "-m", "app.transcription_smoke"]
    environment:
      RECORDING_INPUT_DIR: /data/inbox
      TRANSCRIPT_ROOT: /data/transcripts
      SPEAKER_ROOT: /data/speakers
      SUMMARY_ROOT: /data/documents
      APP_DATA_DIR: /data/app
      SERVICE_NAME: worker
      SPEECH_MODE: real
      DOCUMENT_MODE: fake
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-4}
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_CACHE_ROOT: /models
      XDG_CACHE_HOME: /models/xdg
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      MPLCONFIGDIR: /models/matplotlib
    user: "${MODEL_RUN_UID:-1000}:${MODEL_RUN_GID:-1000}"
    volumes:
      - ${MODEL_CACHE_ROOT:-./runtime/model-cache}:/models
      - ${DATA_ROOT:-./runtime}/inbox:/data/inbox:ro
      - ${DATA_ROOT:-./runtime}/transcripts:/data/transcripts
      - ${DATA_ROOT:-./runtime}/speakers:/data/speakers
      - ${DATA_ROOT:-./runtime}/documents:/data/documents
      - ${DATA_ROOT:-./runtime}/app:/data/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
